name: Move to release
on:
  workflow_call:
    inputs:
      manifestPath:
        required: false
        type: string
        default: ./repo/manifest.json
jobs:
  trmPublish:
    name: TRM Set latest tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@master
        with:
          name: checkout
          path: ./
      - name: Unzip checkout
        run: unzip checkout.zip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TRM client
        run: npm install --global "trm-client@>=13.3.0"
      - name: Read manifest
        id: manifest
        uses: ./actions/regesta/booster/readManifest
        with:
          manifestPath: ${{ inputs.manifestPath }}
      - name: Move rc tag to latest
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.manifest.outputs.packageName }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.local/share/trm"

          VIEW="$(trm view "$PACKAGE_NAME" --connection-type none --logger JSON)" || {
            echo "$VIEW" | jq -r '.logs[]? | "\(.type): \(.text)"'
            exit 1
          }
          RC_VERSION="$(echo "$VIEW" | jq -r '.data.distTags.rc // empty')"

          if [ -z "$RC_VERSION" ]; then
            echo "::notice::No rc tag found for $PACKAGE_NAME; nothing to promote."
            exit 0
          fi

          trm dist-tag add "$PACKAGE_NAME" "$RC_VERSION" latest
          trm dist-tag rm "$PACKAGE_NAME" rc

          echo "### TRM: $PACKAGE_NAME $RC_VERSION -> latest" >> "$GITHUB_STEP_SUMMARY"
